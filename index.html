<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>جارٍ التحميل...</title>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Tajawal',sans-serif;
    background:#0a0e1a;
    color:#e8ecf5;
}

#siteContainer{
    width:100%;height:100vh;
    border:0;display:none;
    background:#fff;
}

#loaderScreen{
    position:fixed;inset:0;
    display:flex;flex-direction:column;
    justify-content:center;align-items:center;
    background:#0a0e1a;
    background-image:
        radial-gradient(circle at 30% 20%,rgba(124,58,237,0.2) 0%,transparent 50%),
        radial-gradient(circle at 70% 80%,rgba(236,72,153,0.15) 0%,transparent 50%);
    z-index:100;
    transition:opacity 0.5s ease;
}
#loaderScreen.hide{opacity:0;pointer-events:none}

.loader-logo{
    width:90px;height:90px;border-radius:26px;
    background:linear-gradient(135deg,#7c3aed,#ec4899,#06b6d4);
    background-size:200% 200%;
    animation:colorFlow 4s ease infinite;
    display:flex;align-items:center;justify-content:center;
    font-size:42px;color:#fff;
    margin-bottom:22px;
    box-shadow:0 20px 60px rgba(124,58,237,0.4);
}
@keyframes colorFlow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}

.loader-title{
    font-size:22px;font-weight:900;
    background:linear-gradient(135deg,#fff,#a78bfa);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    background-clip:text;
    margin-bottom:8px;
}
.loader-sub{font-size:13px;color:#94a3b8;font-weight:600;margin-bottom:26px}

.loader-spinner{
    width:44px;height:44px;
    border:3px solid rgba(124,58,237,0.15);
    border-top-color:#7c3aed;
    border-radius:50%;
    animation:spin 0.8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* Messages */
.message-screen{
    position:fixed;inset:0;
    display:none;flex-direction:column;
    justify-content:center;align-items:center;
    background:#0a0e1a;
    background-image:
        radial-gradient(circle at 50% 50%,rgba(124,58,237,0.15) 0%,transparent 60%);
    padding:24px;text-align:center;
    z-index:90;
}
.message-screen.show{display:flex;animation:cardIn 0.6s cubic-bezier(0.175,0.885,0.32,1.275)}
@keyframes cardIn{from{opacity:0;transform:scale(0.9)}to{opacity:1;transform:scale(1)}}

.message-icon{font-size:80px;margin-bottom:20px}
.message-title{
    font-size:26px;font-weight:900;color:#fff;
    margin-bottom:12px;letter-spacing:-0.3px;
}
.message-desc{
    font-size:15px;color:#94a3b8;
    font-weight:500;line-height:1.7;
    max-width:420px;margin:0 auto 24px;
}
.message-badge{
    display:inline-flex;align-items:center;gap:6px;
    padding:8px 16px;border-radius:999px;
    background:rgba(124,58,237,0.15);
    border:1.5px solid rgba(124,58,237,0.4);
    font-size:12px;font-weight:800;color:#a78bfa;
}
#errorScreen .message-badge{background:rgba(239,68,68,0.15);border-color:rgba(239,68,68,0.4);color:#ef4444}
#maintenanceScreen .message-badge{background:rgba(245,158,11,0.15);border-color:rgba(245,158,11,0.4);color:#f59e0b}
#disabledScreen .message-badge{background:rgba(239,68,68,0.15);border-color:rgba(239,68,68,0.4);color:#ef4444}
</style>
</head>
<body>

<div id="loaderScreen">
    <div class="loader-logo">🎨</div>
    <div class="loader-title">جارٍ التحميل...</div>
    <div class="loader-sub">يتم جلب المحتوى من الخادم</div>
    <div class="loader-spinner"></div>
</div>

<iframe id="siteContainer" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-top-navigation-by-user-activation"></iframe>

<div class="message-screen" id="errorScreen">
    <div class="message-icon">⚠️</div>
    <div class="message-title">لا يوجد محتوى</div>
    <div class="message-desc">لم يتم نشر أي موقع بعد. يرجى المحاولة لاحقاً.</div>
    <div class="message-badge">📭 لا يوجد إصدار</div>
</div>

<div class="message-screen" id="maintenanceScreen">
    <div class="message-icon">🔧</div>
    <div class="message-title">الموقع قيد الصيانة</div>
    <div class="message-desc">نقوم حالياً بإجراء بعض التحديثات. يرجى العودة قريباً.</div>
    <div class="message-badge">🔧 الصيانة جارية</div>
</div>

<div class="message-screen" id="disabledScreen">
    <div class="message-icon">🚫</div>
    <div class="message-title">الموقع متوقف مؤقتاً</div>
    <div class="message-desc">تم إيقاف الموقع من قبل الإدارة. يرجى المحاولة لاحقاً.</div>
    <div class="message-badge">⛔ متوقف</div>
</div>

<script>
/* ═══════════════════════════════════════════════
   نفس Firebase Config
   ═══════════════════════════════════════════════ */
const FIREBASE_CONFIG = {
    apiKey: "AIzaSyBHnknMBiVdigipFyLMNkdFcm_tOQKWc-4",
    authDomain: "aktubar98.firebaseapp.com",
    databaseURL: "https://aktubar98-default-rtdb.firebaseio.com",
    projectId: "aktubar98",
    storageBucket: "aktubar98.appspot.com",
    messagingSenderId: "679902534827",
    appId: "1:679902534827:android:03edb9ea18b42eaef7abee"
};

firebase.initializeApp(FIREBASE_CONFIG);
const DB = firebase.database();

/* نفس المفتاح */
const KEY = 'adminSite';

const $ = id => document.getElementById(id);
const loaderScreen = $('loaderScreen');
const siteContainer = $('siteContainer');
const errorScreen = $('errorScreen');
const maintenanceScreen = $('maintenanceScreen');
const disabledScreen = $('disabledScreen');

let siteData = {};
let hasCountedView = false;

/* ═══════════════════════════════════════════════
   الاستماع المباشر من Firebase
   ═══════════════════════════════════════════════ */
DB.ref(KEY).on('value', snapshot => {
    siteData = snapshot.val() || {};
    render();
}, err => {
    console.error(err);
    hideLoader();
    showScreen(errorScreen);
});

/* ═══════════════════════════════════════════════
   Render
   ═══════════════════════════════════════════════ */
function render() {
    // إخفاء كل الشاشات
    errorScreen.classList.remove('show');
    maintenanceScreen.classList.remove('show');
    disabledScreen.classList.remove('show');
    siteContainer.style.display = 'none';

    // صيانة
    if (siteData.maintenanceMode === true) {
        showScreen(maintenanceScreen);
        hideLoader();
        return;
    }

    // متوقف
    if (siteData.siteEnabled === false) {
        showScreen(disabledScreen);
        hideLoader();
        return;
    }

    // ابحث عن الإصدار النشط
    const activeId = siteData.activeVersionId;
    const versions = siteData.versions || {};
    const active = activeId ? versions[activeId] : null;

    if (!active || !active.code) {
        showScreen(errorScreen);
        hideLoader();
        return;
    }

    // عنوان الصفحة
    if (active.name) document.title = active.name;
    else if (siteData.siteTitle) document.title = siteData.siteTitle;

    // عرض الموقع
    siteContainer.srcdoc = active.code;
    siteContainer.style.display = 'block';

    setTimeout(() => hideLoader(), 300);

    // عدّاد المشاهدات (مرة واحدة لكل جلسة)
    if (!hasCountedView && siteData.viewCounter !== false) {
        hasCountedView = true;
        DB.ref(KEY + '/views').transaction(v => (v || 0) + 1);
    }
}

function showScreen(el) { el.classList.add('show'); }
function hideLoader() {
    loaderScreen.classList.add('hide');
    setTimeout(() => { loaderScreen.style.display = 'none'; }, 500);
}

/* Timeout للأمان */
setTimeout(() => {
    if (loaderScreen.style.display !== 'none' && !siteContainer.srcdoc) {
        hideLoader();
        showScreen(errorScreen);
    }
}, 10000);

console.log('🎨 Viewer ready — reads from Firebase directly');
</script>
</body>
</html>
